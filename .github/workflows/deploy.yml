name: Deploy Worker

# 로컬에 Node 가 없어서 배포를 여기서 대신 한다.
# main 에 푸시되면 GitHub 러너(Node 있음)에서 wrangler deploy 를 실행한다.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {} # 필요하면 Actions 탭에서 수동으로도 실행 가능

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # worker.js 를 고치고 test/parse.test.mjs 의 동일 구현을 안 고치면(README 에도 적힌
      # 흔한 실수) 여기서 잡는다. 예전엔 이 테스트가 로컬에서 사람이 돌려야만 의미가 있었다 —
      # 배포 자체는 이 결과와 무관하게 진행됐다.
      - name: 파싱 로직 테스트 (기록 블록·전사 렌더링·페어링 토큰)
        run: node --test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
