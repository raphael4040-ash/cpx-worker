name: Deploy Worker

# 로컬에 Node 가 없어서 배포를 여기서 대신 한다.
# main 에 푸시되면 GitHub 러너(Node 있음)에서 wrangler deploy 를 실행한다.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {} # 필요하면 Actions 탭에서 수동으로도 실행 가능

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 테스트가 실패하면 배포하지 않는다. 예전엔 테스트가 로컬에서 사람이 돌려야만 의미가 있었다 —
      # 배포 자체는 이 결과와 무관하게 진행됐다.
      - name: 테스트 (샘플러·프롬프트·한도·카드 계약)
        run: node --test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # [placement] region 힌트(2026-01 추가)는 wrangler 3.x 가 모른다 — "placement.mode is a required field" 로 배포가 실패했다 (2026-11-09).
          wranglerVersion: "4"
