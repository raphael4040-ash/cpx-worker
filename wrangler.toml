name = "cpx-upload"
main = "src/worker.js"
compatibility_date = "2026-08-27"  # 배포된 워커의 값. 되돌리면 런타임 동작이 과거로 바뀐다.

# 아래 두 값을 본인 Firebase 프로젝트 값으로 교체하세요.
# 둘 다 비밀값이 아닙니다 (웹앱에도 그대로 노출되는 공개 식별자).
# 실제 접근 통제는 firestore.rules 와 유저별 페어링 토큰이 담당합니다.
[vars]
FIREBASE_PROJECT_ID = "cpx-tracker"
FIREBASE_API_KEY = "AIzaSyD1rN6_CvmmjvV40kRGD37f7TZ2ZwNZpqA"
# 학생마다 자기 키를 실어 보내므로 여기 비밀값은 없다. 모델만 지정한다.
# "gemini-2.5-flash" 처럼 특정 버전을 박아두면 몇 달 뒤 그 버전이 없어져 조용히 실패한다
# (실제로 한 번 그랬다). gemini-flash-latest(풀 Flash)는 다들 기본값으로 몰려서
# 무료 티어에서 503(고부하) 이 잦았다 — 환자 연기·채점 정도는 lite 모델로 충분해서
# 상대적으로 여유 있는 Flash-Lite 로 바꿨다. 이것도 결국 언젠가 후속 버전에 밀려날 수
# 있으니, 배포 실패나 404 가 나면 https://ai.google.dev/gemini-api/docs/models 에서
# 현재 stable 로 표시된 flash-lite 모델명으로 갈아끼울 것.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# 예전엔 여기 [[kv_namespaces]] 로 면담 세션을 저장했다. Cloudflare Worker 에서
# generativelanguage.googleapis.com 으로 나가는 요청이 구글 쪽 지역 차단
# ("User location is not supported")에 걸려서, Gemini 호출을 브라우저가 직접
# 하는 구조로 바꿨다 — 이제 이 Worker 는 면담 세션을 들고 있지 않는다.
#
# 아래 KV 는 그것과 다른 용도다 — /interview/start 는 로그인이 필요 없어 인증으로
# 막을 수 없으므로, IP 당 요청 수를 세는 레이트리밋 용도로만 쓴다(src/worker.js 의
# checkRateLimit 참고). 바인딩을 안 채우면 레이트리밋 없이 그냥 통과한다(가용성 우선).
#
# 네임스페이스 만들기: `npx wrangler kv namespace create RATE_LIMIT_KV` 로 만들거나
# Cloudflare 대시보드 > Workers & Pages > KV 에서 만든 뒤, 나온 id 를 채우고 주석을 풀 것.
# deploy_multi.py 와 wrangler 둘 다 이 섹션을 그대로 읽어 바인딩으로 올린다.
# 주석 처리된 채로 두면(기본값) checkRateLimit 이 env.RATE_LIMIT_KV 를 못 받아 레이트리밋
# 없이 그냥 통과한다 — 존재하지 않는 id 로 배포를 깨뜨리지 않기 위한 안전한 기본값이다.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_ME_KV_NAMESPACE_ID"
